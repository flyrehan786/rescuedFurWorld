<div class="login">
  <div class="login__blob login__blob--one" aria-hidden="true"></div>
  <div class="login__blob login__blob--two" aria-hidden="true"></div>

  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <span class="login__badge">🐾</span>
    <span class="eyebrow">RescuedFurWorld</span>
    <h1>Welcome back</h1>
    <p class="form-hint">Sign in to manage cat stories.</p>

    <div class="alert alert--error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="form-field">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="admin" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    <button type="submit" class="btn btn--primary" [disabled]="form.invalid || submitting">
      <span class="login__spinner" *ngIf="submitting"></span>
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <a routerLink="/" class="login__back-link">← Back to website</a>
</div>
