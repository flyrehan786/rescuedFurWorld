<div class="gallery-manager">
  <div class="gallery-manager__header">
    <div>
      <span class="eyebrow">Media</span>
      <h1>Gallery</h1>
    </div>

    <label class="btn btn--primary gallery-manager__upload-btn">
      {{ uploading ? 'Uploading…' : '+ Upload image' }}
      <input
        type="file"
        accept="image/png,image/jpeg,image/gif,image/webp"
        [disabled]="uploading"
        (change)="onFileSelected($event)"
        hidden
      />
    </label>
  </div>

  <div class="gallery-manager__caption-row">
    <label for="caption">Caption (optional, applies to next upload)</label>
    <input id="caption" type="text" [(ngModel)]="caption" placeholder="e.g. Milo's first birthday" />
  </div>

  <div class="alert alert--error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="alert alert--error" *ngIf="uploadError">{{ uploadError }}</div>

  <p *ngIf="loading">Loading gallery…</p>

  <p *ngIf="!loading && images.length === 0">No images yet. Upload your first gallery photo.</p>

  <div class="gallery-grid" *ngIf="!loading && images.length > 0">
    <div class="gallery-grid__item card" *ngFor="let image of images">
      <img [src]="image.url" [alt]="image.caption || 'Gallery image'" />
      <div class="gallery-grid__meta">
        <span class="gallery-grid__caption">{{ image.caption || '—' }}</span>
        <button
          type="button"
          class="btn btn--danger btn--small"
          [disabled]="deletingId === image.id"
          (click)="deleteImage(image)"
        >
          {{ deletingId === image.id ? 'Deleting…' : 'Delete' }}
        </button>
      </div>
    </div>
  </div>
</div>
