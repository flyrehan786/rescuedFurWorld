<div class="admin admin-zinc">
  <header class="admin__header">
    <div class="admin__header-inner">
      <div class="admin__brand">
        <a routerLink="/">🐾 RescuedFurWorld</a>
        <span class="admin__badge">Admin</span>
      </div>

      <div class="admin__header-right">
        <nav class="admin__nav">
          <a routerLink="/admin/cats" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Cats</a>
          <a routerLink="/admin/cats/new" routerLinkActive="active">Add cat</a>
          <a routerLink="/admin/gallery" routerLinkActive="active">Gallery</a>
          <a routerLink="/admin/settings" routerLinkActive="active">Settings</a>
          <a routerLink="/" class="admin__nav-visit">Visit website</a>
        </nav>

        <div class="admin__account">
          <img *ngIf="photo" [src]="photo" alt="Profile photo" class="admin__avatar" />
          <span
            *ngIf="!photo && username"
            class="admin__avatar admin__avatar--initial"
          >{{ username.charAt(0).toUpperCase() }}</span>
          <span *ngIf="username">{{ username }}</span>
          <button type="button" class="btn btn--outline btn--small" (click)="logout()">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="admin__content">
    <router-outlet></router-outlet>
  </main>
</div>
