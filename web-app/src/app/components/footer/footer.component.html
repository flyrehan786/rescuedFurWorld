<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <img
        [src]="isDarkTheme ? 'assets/dark.png' : 'assets/light.png'"
        alt="RescuedFurWorld logo"
        class="brand-logo"
      />
      <span class="brand-logo-divider"></span>
      <span class="footer__name brand-name">RescuedFurWorld</span>
    </div>

    <p class="footer__tagline">Every cat has a story. Here is ours &mdash; from rescue to recovery.</p>

    <div class="footer__social">
      <a href="https://www.youtube.com/@RescuedFurWorld" target="_blank" rel="noopener noreferrer" aria-label="YouTube">YouTube</a>
      <a href="https://facebook.com/RescuedFurWorld" target="_blank" rel="noopener noreferrer" aria-label="Facebook">Facebook</a>
    </div>

    <p class="footer__copy">&copy; {{ year }} RescuedFurWorld. Made with love for our rescued cats.</p>

    <a routerLink="/admin/login" class="footer__admin-link">Staff Login</a>
  </div>
</footer>
