<div class="login admin-zinc">
  <div class="login__brand">
    <div class="login__blob login__blob--one" aria-hidden="true"></div>
    <div class="login__blob login__blob--two" aria-hidden="true"></div>

    <div class="login__brand-content">
      <div class="login__brand-header">
        <img
          [src]="isDarkTheme ? 'assets/dark.png' : 'assets/light.png'"
          alt="RescuedFurWorld logo"
          class="brand-logo brand-logo--lg"
        />
        <span class="brand-logo-divider"></span>
        <span class="login__brand-name brand-name brand-name--lg">RescuedFurWorld</span>
      </div>
      <p class="login__brand-tagline">Every cat has a story. Sign in to keep sharing theirs&mdash;rescue, recovery, and every second chance in between.</p>
    </div>
  </div>

  <div class="login__panel">
    <div class="login__stack">
      <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
        <div class="login__brand-row">
          <img
            [src]="isDarkTheme ? 'assets/dark.png' : 'assets/light.png'"
            alt="RescuedFurWorld logo"
            class="brand-logo"
          />
          <span class="brand-logo-divider"></span>
          <span class="login__logo-name brand-name">RescuedFurWorld</span>
        </div>
        <h1>Welcome back</h1>
        <p class="form-hint">Sign in to manage cat stories.</p>

        <div class="alert alert--error" *ngIf="errorMessage">{{ errorMessage }}</div>

        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="admin" />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        </div>

        <button type="submit" class="btn btn--primary" [disabled]="form.invalid || submitting">
          <span class="login__spinner" *ngIf="submitting"></span>
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>

      <a routerLink="/" class="login__back-link">← Back to website</a>
    </div>
  </div>
</div>
